version: 2

sources:
  - name: raw
    schema: gz_raw_data
    description: "Greenweez ham verileri"
    tables:
      - name: sales
        identifier: raw_gz_sales
        # ... (diğer kolonların burada kalabilir)
      - name: product
        identifier: raw_gz_product
      - name: ship
        identifier: raw_gz_ship

# Burası çok önemli: finance_days senin yarattığın bir model!
models:
  - name: finance_days
    description: "Finans ekibi için günlük performans metriklerini içeren ana tablo."
    columns:
      - name: date_date
        description: "İşlemlerin gerçekleştiği gün."
        tests:
          - unique
          - not_null
      - name: nb_transactions
        description: "O gün gerçekleşen toplam sipariş sayısı."
      - name: revenue
        description: "Günlük toplam gelir."
      - name: average_basket
        description: "Sipariş başına düşen ortalama tutar (Gelir / Sipariş Sayısı)."